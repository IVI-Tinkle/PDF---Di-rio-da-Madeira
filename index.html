<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documento</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <iframe src="documento.pdf" title="Visualización del documento PDF">
    <p>
      Tu navegador no puede mostrar el PDF.
      <a href="documento.pdf">Abrir o descargar el documento</a>
    </p>
  </iframe>
</body>
</html>
